services:
  win-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
      # the default bridge network of the builder has no route out on some
      # hosts, which fails the pip step
      network: host
    container_name: win-mcp-server
    restart: unless-stopped
    ports:
      # published on the loopback interface only; put a TLS proxy in front to
      # expose it any wider
      - "127.0.0.1:8005:8005"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # required shared secret; the server refuses to start without it
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN in .env}
      # inside the container all interfaces are fine: the published port above
      # is what limits reachability
      - MCP_BIND_HOST=${MCP_BIND_HOST:-0.0.0.0}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.socket(); s.settimeout(2); r=s.connect_ex(('127.0.0.1',8005)); s.close(); exit(0 if r==0 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
